spring:
  application:
    name: insurance-platform-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_COMMAND_TIMEOUT:1s}

server:
  port: ${JAVA_BACKEND_PORT:8080}

insurance:
  ai-service:
    base-url: ${PYTHON_AI_BASE_URL:http://127.0.0.1:8000}
    connect-timeout: ${PYTHON_AI_CONNECT_TIMEOUT:3s}
    read-timeout: ${PYTHON_AI_READ_TIMEOUT:60s}
  knowledge-client:
    read-timeout: ${PYTHON_KNOWLEDGE_READ_TIMEOUT:300s}
  ai-health:
    connect-timeout: ${PYTHON_HEALTH_CONNECT_TIMEOUT:1s}
    read-timeout: ${PYTHON_HEALTH_READ_TIMEOUT:2s}
  resilience:
    sliding-window-size: 20
    minimum-number-of-calls: 10
    failure-rate-threshold: 50
    wait-duration-in-open-state: 30s
    permitted-calls-in-half-open-state: 3
  document-storage:
    root: ${DOCUMENT_STORAGE_ROOT:./data/documents}
    max-size: 20MB
  redis:
    environment: ${APP_ENV:dev}
    recent-messages-ttl: 30m
    rate-limit-ttl: 120s
    idempotency-ttl: 24h
    chat-rate-limit-per-minute: 20
  security:
    jwt:
      issuer: ${JWT_ISSUER:insurance-ai-platform}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
      secret-base64: ${JWT_SECRET_BASE64:}

springdoc:
  paths-to-match: /api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,pythonReadiness
        liveness:
          include: livenessState

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=java traceId=%X{traceId:-NONE} logger=%logger{36} message=%msg%n"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

