spring:
  application:
    name: insurance-platform-backend

server:
  port: ${JAVA_BACKEND_PORT:8080}

insurance:
  ai-service:
    base-url: ${PYTHON_AI_BASE_URL:http://127.0.0.1:8000}
    connect-timeout: ${PYTHON_AI_CONNECT_TIMEOUT:3s}
    read-timeout: ${PYTHON_AI_READ_TIMEOUT:60s}

springdoc:
  paths-to-match: /api/v1/**

