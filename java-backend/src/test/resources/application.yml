spring:
  datasource:
    url: jdbc:h2:mem:insurance_ai;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

insurance:
  ai-service:
    base-url: http://127.0.0.1:8000
    connect-timeout: 3s
    read-timeout: 60s
  knowledge-client:
    read-timeout: 300s
  ai-health:
    connect-timeout: 1s
    read-timeout: 2s
  resilience:
    sliding-window-size: 20
    minimum-number-of-calls: 10
    failure-rate-threshold: 50
    wait-duration-in-open-state: 30s
    permitted-calls-in-half-open-state: 3
  document-storage:
    root: ${java.io.tmpdir}/insurance-platform-tests/documents
    max-size: 20MB

springdoc:
  paths-to-match: /api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,pythonReadiness
        liveness:
          include: livenessState
