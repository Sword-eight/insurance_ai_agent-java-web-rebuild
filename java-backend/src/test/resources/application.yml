spring:
  datasource:
    url: jdbc:h2:mem:insurance_ai;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

insurance:
  ai-service:
    base-url: http://127.0.0.1:8000
    connect-timeout: 3s
    read-timeout: 60s

springdoc:
  paths-to-match: /api/v1/**
